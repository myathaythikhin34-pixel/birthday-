<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>

<style>

/* Basic Reset and Background */
body{
    margin:0;
    padding:0;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background-color:#FFC0CB;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
    max-width:90%;
}

/* Bigger Photo */
.profile-photo{
    width:420px;
    height:420px;
    object-fit:cover;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
    margin-bottom:30px;
}

/* Text */
h1{
    color:#d81b60;
    font-size:3.2rem;
    margin-bottom:40px;
    text-shadow:2px 2px 4px rgba(0,0,0,0.1);
}

/* Bigger Button */
.back-button{
    display:inline-block;
    padding:22px 60px;
    font-size:1.5rem;
    font-weight:bold;
    color:white;
    background-color:#ff4081;
    text-decoration:none;
    border-radius:60px;
    transition:all 0.3s ease;
    box-shadow:0 6px 20px rgba(255,64,129,0.4);
    cursor:pointer;
    border:none;
}

/* Hover effect */
.back-button:hover{
    transform:translateY(-6px);
    background-color:#f50057;
    box-shadow:0 0 25px rgba(255,64,129,0.9),
               0 0 50px rgba(255,64,129,0.4);
    letter-spacing:1px;
}

.back-button:active{
    transform:translateY(0);
}

</style>
</head>

<body>

<div class="container">

    <img src="no.jpg" alt="Birthday Person" class="profile-photo">

    <h1>what the hell no ?! i know it is your birthday !</h1>

    <a href="main.html" class="back-button">GO BACK</a>

</div>

</body>
</html>
